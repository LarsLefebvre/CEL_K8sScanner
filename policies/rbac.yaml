# RBAC policies.
#
# Only bindings are evaluated: a Role or ClusterRole grants nothing until
# something binds it to a subject. Each binding is resolved against the role
# it references (`cluster.clusterRoles` / `cluster.roles`), and
# `rules.allows(verb, apiGroup, resource)` applies Kubernetes RBAC wildcard
# semantics. Built-in bindings (label kubernetes.io/bootstrapping=rbac-defaults)
# and system:/kubeadm: subjects are skipped. One finding per binding.

id: admin-binding
name: Admin-equivalent access granted
severity: critical
tactic: Privilege Escalation
mitre: [T1098.006]
threatMatrix: [privilege-escalation/cluster-admin-binding]
description: >-
  Binding cluster-admin, or any role that allows every verb on every resource, gives its subjects full control within the binding's scope.
match:
  kinds: [ClusterRoleBinding, RoleBinding]
variables:
  - name: builtin
    expression: object.metadata.?labels[?'kubernetes.io/bootstrapping'].orValue('') == 'rbac-defaults'
  - name: role
    expression: |
      (object.roleRef.kind == 'ClusterRole'
        ? cluster.clusterRoles[?object.roleRef.name]
        : cluster.roles[?object.metadata.?namespace.orValue('') + '/' + object.roleRef.name]).orValue({})
  - name: rules
    expression: variables.role.?rules.orValue([])
  - name: admin
    expression: object.roleRef.name == 'cluster-admin' || variables.rules.allows('*', '*', '*')
  - name: subjects
    expression: |
      object.?subjects.orValue([]).filter(s, !s.name.startsWith('system:') && !s.name.startsWith('kubeadm:'))
  - name: who
    expression: |
      variables.subjects.map(s, s.kind + ' ' + (has(s.namespace) ? s.namespace + '/' : '') + s.name).join(', ')
  - name: via
    expression: |
      ' via ' + object.roleRef.kind + ' "' + object.roleRef.name + '"' +
        (object.kind == 'ClusterRoleBinding' ? ' cluster-wide' : ' in namespace ' + object.metadata.namespace)
  - name: bindingMeta
    expression: "{'name': object.metadata.name, ?'namespace': object.metadata.?namespace}"
violations: |
  variables.builtin || !variables.admin || variables.subjects.size() == 0 ? [] : [{
    'message': 'grants ' + variables.who + ' full admin rights' + variables.via,
    'found': {'roleRef': object.roleRef, 'subjects': variables.subjects},
    // roleRef is immutable, so the binding is replaced.
    'fix': {
      'apiVersion': 'rbac.authorization.k8s.io/v1',
      'kind': object.kind,
      'metadata': variables.bindingMeta,
      'roleRef': {'apiGroup': 'rbac.authorization.k8s.io', 'kind': 'ClusterRole', 'name': 'view'},
      'subjects': object.subjects
    }
  }]
remediation: >-
  Give day-to-day access through a narrower role (the fix uses the built-in read-only `view` role) and grant
  admin rights just-in-time. CI should get only the verbs and resources it deploys.
references:
  - https://kubernetes.io/docs/concepts/security/rbac-good-practices/#least-privilege

