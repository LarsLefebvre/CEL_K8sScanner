id: secrets-access
name: Secrets readable
severity: high
tactic: Credential Access
mitre: [T1552.007]
threatMatrix: [credential-access/list-k8s-secrets]
description: >-
  get/list/watch on Secrets exposes every credential in scope, including tokens of more privileged service accounts. `list` returns secret contents too.
match:
  kinds: [ClusterRoleBinding, RoleBinding]
variables:
  - name: builtin
    expression: object.metadata.?labels[?'kubernetes.io/bootstrapping'].orValue('') == 'rbac-defaults'
  - name: role
    expression: |
      (object.roleRef.kind == 'ClusterRole'
        ? cluster.clusterRoles[?object.roleRef.name]
        : cluster.roles[?object.metadata.?namespace.orValue('') + '/' + object.roleRef.name]).orValue({})
  - name: rules
    expression: variables.role.?rules.orValue([])
  - name: admin
    expression: object.roleRef.name == 'cluster-admin' || variables.rules.allows('*', '*', '*')
  - name: subjects
    expression: |
      object.?subjects.orValue([]).filter(s, !s.name.startsWith('system:') && !s.name.startsWith('kubeadm:'))
  - name: who
    expression: |
      variables.subjects.map(s, s.kind + ' ' + (has(s.namespace) ? s.namespace + '/' : '') + s.name).join(', ')
  - name: via
    expression: |
      ' via ' + object.roleRef.kind + ' "' + object.roleRef.name + '"' +
        (object.kind == 'ClusterRoleBinding' ? ' cluster-wide' : ' in namespace ' + object.metadata.namespace)
  - name: bindingMeta
    expression: "{'name': object.metadata.name, ?'namespace': object.metadata.?namespace}"
  - name: checks
    expression: |
      [
        ['get', '', 'secrets', 'get secrets'],
        ['list', '', 'secrets', 'list secrets'],
        ['watch', '', 'secrets', 'watch secrets']
      ]
  - name: found
    expression: variables.checks.filter(c, variables.rules.allows(c[0], c[1], c[2])).map(c, c[3])
  # Rules that grant something risky, and the same rules with only the risky verbs removed.
  - name: riskyRules
    expression: variables.rules.filter(r, variables.checks.exists(c, [r].allows(c[0], c[1], c[2])))
  - name: fixedRules
    expression: |
      variables.rules.map(r, cel.bind(risky,
        r.?resources.orValue([]).filter(res, variables.checks.exists(c,
          [{'apiGroups': r.?apiGroups.orValue([]), 'resources': [res], 'verbs': r.?verbs.orValue([])}].allows(c[0], c[1], c[2]))),
        cel.bind(drop, variables.checks.filter(c, [r].allows(c[0], c[1], c[2])).map(c, c[0]),
          risky.size() == 0 ? [r] :
            // Resources that are not risky keep every verb ...
            (r.resources.filter(res, !(res in risky)).size() == 0 ? [] : [{
              ?'apiGroups': r.?apiGroups, 'resources': r.resources.filter(res, !(res in risky)),
              ?'resourceNames': r.?resourceNames, 'verbs': r.verbs}]) +
            // ... risky ones lose only the risky verbs.
            (r.verbs.filter(v, !(v in drop) && v != '*').size() == 0 ? [] : [{
              ?'apiGroups': r.?apiGroups, 'resources': risky,
              ?'resourceNames': r.?resourceNames, 'verbs': r.verbs.filter(v, !(v in drop) && v != '*')}])
        ))).flatten()
violations: |
  // Admin-equivalent grants are reported once, by admin-binding.
  variables.builtin || variables.admin || variables.found.size() == 0 || variables.subjects.size() == 0 ? [] : [{
    'message': 'grants ' + variables.who + ' the ability to ' + variables.found.join(', ') + variables.via,
    'target': {'kind': object.roleRef.kind, 'name': object.roleRef.name,
               ?'namespace': object.roleRef.kind == 'Role' ? object.metadata.?namespace : optional.none()},
    'found': {'rules': variables.riskyRules},
    'fix': {'rules': variables.fixedRules}
  }]
remediation: >-
  Remove the Secrets verbs from the role (the patch keeps every other permission), or restrict them with `resourceNames` to the specific secrets needed.

