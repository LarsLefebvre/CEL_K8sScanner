id: anonymous-access
name: Permissions granted to anonymous or all users
severity: critical
tactic: Initial Access
mitre: [T1078.001]
threatMatrix: [initial-access/exposed-sensitive-interfaces]
description: >-
  system:authenticated includes every user and every service account in the cluster; system:anonymous and
  system:unauthenticated include anyone who can reach the API server.
match:
  kinds: [ClusterRoleBinding, RoleBinding]
variables:
  - name: builtin
    expression: object.metadata.?labels[?'kubernetes.io/bootstrapping'].orValue('') == 'rbac-defaults'
  - name: role
    expression: |
      (object.roleRef.kind == 'ClusterRole'
        ? cluster.clusterRoles[?object.roleRef.name]
        : cluster.roles[?object.metadata.?namespace.orValue('') + '/' + object.roleRef.name]).orValue({})
  - name: rules
    expression: variables.role.?rules.orValue([])
  - name: admin
    expression: object.roleRef.name == 'cluster-admin' || variables.rules.allows('*', '*', '*')
  - name: subjects
    expression: |
      object.?subjects.orValue([]).filter(s, !s.name.startsWith('system:') && !s.name.startsWith('kubeadm:'))
  - name: who
    expression: |
      variables.subjects.map(s, s.kind + ' ' + (has(s.namespace) ? s.namespace + '/' : '') + s.name).join(', ')
  - name: via
    expression: |
      ' via ' + object.roleRef.kind + ' "' + object.roleRef.name + '"' +
        (object.kind == 'ClusterRoleBinding' ? ' cluster-wide' : ' in namespace ' + object.metadata.namespace)
  - name: bindingMeta
    expression: "{'name': object.metadata.name, ?'namespace': object.metadata.?namespace}"
  - name: everyone
    expression: "['system:anonymous', 'system:unauthenticated', 'system:authenticated']"
  - name: broad
    expression: object.?subjects.orValue([]).filter(s, s.name in variables.everyone)
  - name: rest
    expression: object.?subjects.orValue([]).filter(s, !(s.name in variables.everyone))
violations: |
  variables.builtin || variables.broad.size() == 0 ? [] : [{
    'message': 'grants ' + object.roleRef.kind + ' "' + object.roleRef.name + '" to ' + variables.broad.map(s, s.name).join(', '),
    'found': {'roleRef': object.roleRef, 'subjects': variables.broad},
    'action': variables.rest.size() > 0 ? 'replace' : 'delete',
    'fix': variables.rest.size() > 0 ? dyn({
      'apiVersion': 'rbac.authorization.k8s.io/v1',
      'kind': object.kind,
      'metadata': variables.bindingMeta,
      'roleRef': object.roleRef,
      'subjects': variables.rest
    }) : dyn(null)
  }]
remediation: >-
  Remove the broad group from the binding (or delete the binding) and grant the permissions to specific
  users, groups or service accounts.

